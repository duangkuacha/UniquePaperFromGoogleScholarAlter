<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Scholar 文献库</title>
  <style>
    :root { --ink:#172033; --muted:#697386; --line:#e7eaf0; --brand:#3b5bdb; --soft:#f6f8ff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#f4f6fa; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(1120px,calc(100% - 32px)); margin:32px auto 64px; }
    header { padding:28px; color:white; border-radius:20px; background:linear-gradient(135deg,#263b80,#4c6fff); box-shadow:0 12px 32px #263b8030; }
    h1 { margin:0 0 8px; font-size:clamp(26px,4vw,40px); }
    header p { margin:0; color:#e6ebff; }
    .controls { margin:20px 0; }
    input,select { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:inherit; }
    .search-row { display:flex; align-items:center; gap:12px; }
    .search-box { position:relative; display:block; flex:1; }
    .search-box::before { position:absolute; top:12px; left:14px; color:#9aa3b5; content:"⌕"; font-size:20px; line-height:1; }
    .search-box input { padding-left:40px; }
    .quick-filter { display:flex; gap:8px; }
    .quick-filter button, .calendar-all, .today-button { padding:10px 14px; border:1px solid #c9d2f8; border-radius:10px; background:#fff; color:var(--brand); cursor:pointer; font:inherit; white-space:nowrap; }
    .quick-filter button:hover, .calendar-all:hover, .today-button:hover { background:var(--soft); }
    .quick-filter button.active, .calendar-all.active { border-color:var(--brand); background:var(--brand); color:#fff; }
    .calendar { max-width:720px; margin:14px auto 0; padding:20px 22px 16px; border:1px solid #dfe5f3; border-radius:18px; background:linear-gradient(145deg,#fff,#f8faff); box-shadow:0 10px 26px #263b8014; }
    .calendar-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .calendar-label { font-size:14px; font-weight:700; letter-spacing:.02em; }
    .calendar-hint { margin-top:3px; color:var(--muted); font-size:12px; }
    .calendar-month-count { color:var(--brand); font-size:12px; font-weight:600; }
    .calendar-head { display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:14px; }
    .calendar-title { min-width:150px; margin:0; font-size:19px; font-weight:750; text-align:center; }
    .calendar-nav { width:34px; height:34px; border:1px solid #dce3f7; border-radius:50%; background:#fff; color:var(--brand); cursor:pointer; font:inherit; font-size:22px; line-height:1; }
    .calendar-nav:hover:not(:disabled) { background:var(--soft); border-color:#b8c4f4; }
    .calendar-nav:disabled { cursor:default; opacity:.35; }
    .calendar-weekdays, .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
    .calendar-weekdays { margin-bottom:5px; color:#8b95a9; font-size:12px; font-weight:600; text-align:center; }
    .calendar-weekdays span { padding:3px 0; }
    .calendar-cell { position:relative; min-height:42px; border:1px solid transparent; border-radius:11px; background:transparent; color:#9aa3b5; cursor:pointer; font:inherit; transition:background .15s,border-color .15s,transform .15s; }
    .calendar-cell:hover { border-color:#c5cff4; background:#eef2ff; transform:translateY(-1px); }
    .calendar-cell.has-data { color:var(--ink); font-weight:600; }
    .calendar-cell.today:not(.selected) { border-color:#7c8de8; }
    .calendar-cell.selected { border-color:var(--brand); background:var(--brand); color:#fff; font-weight:700; box-shadow:0 4px 10px #3b5bdb40; }
    .calendar-cell::after { position:absolute; bottom:5px; left:50%; width:4px; height:4px; border-radius:50%; background:transparent; content:""; transform:translateX(-50%); }
    .calendar-cell.has-data::after { background:#7c8de8; }
    .calendar-cell.selected::after { background:#fff; }
    .calendar-cell:disabled { opacity:.72; }
    .calendar-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; padding-top:13px; border-top:1px solid #e8edf7; }
    .calendar-legend { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; }
    .calendar-legend::before { width:6px; height:6px; border-radius:50%; background:#7c8de8; content:""; }
    .calendar-all { padding:8px 12px; font-size:13px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .stats { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 18px; }
    .stat { padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:white; color:var(--muted); }
    .stat strong { color:var(--ink); }
    #status { color:var(--muted); margin:12px 0; }
    .paper { margin:12px 0; padding:20px; border:1px solid var(--line); border-radius:14px; background:#fff; box-shadow:0 4px 14px #1b2a4a0a; }
    .paper h2 { margin:0 0 8px; font-size:19px; line-height:1.4; }
    .paper h2 a { color:var(--brand); text-decoration:none; }
    .paper h2 a:hover { text-decoration:underline; }
    .authors { margin-bottom:10px; color:#19704a; font-size:14px; }
    .abstract { margin:0; color:#4f596d; line-height:1.65; }
    .empty { padding:44px 20px; text-align:center; border:1px dashed #cdd4e1; border-radius:14px; color:var(--muted); background:white; }
    .pagination-bar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:22px; padding:14px 0; }
    .page-size { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; }
    .page-size select { width:auto; min-width:82px; padding:8px 10px; }
    .pagination { display:flex; align-items:center; justify-content:flex-end; gap:5px; flex-wrap:wrap; }
    .pagination button { min-width:36px; height:36px; padding:0 9px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); cursor:pointer; font:inherit; }
    .pagination button:hover:not(:disabled), .pagination button.current { border-color:var(--brand); background:var(--brand); color:#fff; }
    .pagination button:disabled { cursor:default; opacity:.45; }
    .pagination .ellipsis { padding:0 3px; color:var(--muted); }
    footer { margin-top:28px; color:var(--muted); font-size:13px; }
    @media (max-width:680px) { main { width:min(100% - 20px,1120px); margin-top:10px; } header { padding:22px; } .search-row { align-items:stretch; flex-direction:column; } .quick-filter { justify-content:flex-end; } .calendar { padding:16px 12px 12px; } .calendar-weekdays, .calendar-grid { gap:4px; } .calendar-cell { min-height:38px; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Google Scholar 文献库</h1>
    <p>按日期浏览邮件中整理的去重论文，支持标题、作者和摘要搜索。</p>
  </header>
  <section class="controls" aria-label="筛选">
    <div class="search-row">
      <label class="search-box" for="search"><span class="sr-only">搜索论文</span><input id="search" type="search" placeholder="搜索标题、作者或摘要…" aria-label="搜索论文"></label>
      <div class="quick-filter">
        <button id="today-date" type="button">今天</button>
        <button id="all-dates" class="calendar-all active" type="button">全部日期</button>
      </div>
    </div>
    <div class="calendar" aria-label="按日期筛选">
      <div class="calendar-top">
        <div><div class="calendar-label">按日期浏览</div><div id="calendar-hint" class="calendar-hint">选择一个日期查看当天邮件</div></div>
        <span id="calendar-month-count" class="calendar-month-count"></span>
      </div>
      <div class="calendar-head">
        <button id="previous-month" class="calendar-nav" type="button" aria-label="上个月">‹</button>
        <h2 id="calendar-title" class="calendar-title"></h2>
        <button id="next-month" class="calendar-nav" type="button" aria-label="下个月">›</button>
      </div>
      <div class="calendar-weekdays" aria-hidden="true">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="日期"></div>
      <div class="calendar-footer">
        <span class="calendar-legend">有数据的日期</span>
        <span id="calendar-selection" class="calendar-hint">当前显示全部日期</span>
      </div>
    </div>
  </section>
  <div id="stats" class="stats"></div>
  <div id="status">正在读取数据…</div>
  <section id="papers"></section>
  <div id="pagination-bar" class="pagination-bar" hidden>
    <label class="page-size" for="page-size">每页显示
      <select id="page-size" aria-label="每页显示条数">
        <option value="50" selected>50 条</option>
        <option value="100">100 条</option>
      </select>
    </label>
    <nav id="pagination" class="pagination" aria-label="论文分页"></nav>
  </div>
  <footer>数据由 GitHub Actions 定时从 Gmail Google Scholar Alert 邮件更新。页面只包含论文元数据，不保存 OAuth 凭据。</footer>
</main>
<script>
  const state = { days: [], papers: [], page: 1, pageSize: 50, selectedDate: 'all', calendarMonth: null, availableDates: new Set() };
  const $ = (id) => document.getElementById(id);
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatDate = (date) => date && date.length === 8 ? `${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6,8)}` : date;
  const dateKey = (date) => `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, '0')}${String(date.getDate()).padStart(2, '0')}`;
  const monthKey = (date) => `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, '0')}`;
  const monthFromKey = (key) => new Date(Number(key.slice(0,4)), Number(key.slice(4,6)) - 1, 1);

  function renderCalendar() {
    if (!state.calendarMonth) return;
    const month = state.calendarMonth;
    const title = new Intl.DateTimeFormat('zh-CN', { year:'numeric', month:'long' }).format(month);
    $('calendar-title').textContent = title;
    const currentMonth = monthKey(month);
    const monthKeys = [...new Set([...state.availableDates].map(date => date.slice(0,6)).concat(monthKey(new Date())))].sort();
    const minMonth = monthKeys[0] || currentMonth;
    const maxMonth = monthKeys[monthKeys.length - 1] || currentMonth;
    $('previous-month').disabled = currentMonth <= minMonth;
    $('next-month').disabled = currentMonth >= maxMonth;
    const firstDay = new Date(month.getFullYear(), month.getMonth(), 1).getDay();
    const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
    const today = dateKey(new Date());
    const cells = [];
    for (let i = 0; i < firstDay; i += 1) cells.push('<span aria-hidden="true"></span>');
    for (let day = 1; day <= daysInMonth; day += 1) {
      const date = dateKey(new Date(month.getFullYear(), month.getMonth(), day));
      const hasData = state.availableDates.has(date);
      const selected = state.selectedDate === date;
      const classes = ['calendar-cell'];
      if (hasData) classes.push('has-data');
      if (selected) classes.push('selected');
      if (today === date) classes.push('today');
      cells.push(`<button type="button" class="${classes.join(' ')}" data-date="${date}" aria-label="${formatDate(date)}${hasData ? '，有论文' : '，无数据'}" ${selected ? 'aria-pressed="true"' : ''}>${day}</button>`);
    }
    while (cells.length < 42) cells.push('<span aria-hidden="true"></span>');
    $('calendar-grid').innerHTML = cells.join('');
    const monthCount = [...state.availableDates].filter(date => date.startsWith(currentMonth)).length;
    $('calendar-month-count').textContent = `本月 ${monthCount} 个日期有数据`;
    $('all-dates').classList.toggle('active', state.selectedDate === 'all');
    $('today-date').classList.toggle('active', state.selectedDate === dateKey(new Date()));
    $('calendar-selection').textContent = state.selectedDate === 'all' ? '当前显示全部日期' : `当前选择 ${formatDate(state.selectedDate)}`;
    $('calendar-hint').textContent = state.selectedDate === 'all' ? '点击日期查看当天收取的论文' : '点击其他日期切换筛选';
  }

  function render() {
    const query = $('search').value.trim().toLocaleLowerCase();
    const selected = state.selectedDate;
    const filtered = state.papers.filter(item => {
      const dateOk = selected === 'all' || item.date === selected;
      const haystack = `${item.title} ${item.authors} ${item.abstract}`.toLocaleLowerCase();
      return dateOk && (!query || haystack.includes(query));
    });
    const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    const start = filtered.length ? (state.page - 1) * state.pageSize : 0;
    const visible = filtered.slice(start, start + state.pageSize);
    const range = filtered.length ? `${start + 1}-${start + visible.length} / ${filtered.length}` : '0 / 0';
    $('stats').innerHTML = `<div class="stat">显示 <strong>${range}</strong> 篇论文</div><div class="stat">收录 <strong>${state.days.length}</strong> 个日期文件</div>`;
    $('status').textContent = filtered.length ? `最后筛选结果：${filtered.length} 篇` : '没有匹配的论文';
    if (!filtered.length) { $('papers').innerHTML = '<div class="empty">没有找到符合条件的论文。</div>'; $('pagination-bar').hidden = true; return; }
    $('papers').innerHTML = visible.map(item => {
      const title = escapeHtml(item.title);
      const titleHtml = item.url ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${title}</a>` : title;
      return `<article class="paper"><h2>${titleHtml}</h2><div class="authors">${escapeHtml(item.authors || '作者信息未提供')} · ${formatDate(item.date)}</div><p class="abstract">${escapeHtml(item.abstract || '没有摘要')}</p></article>`;
    }).join('');
    $('pagination-bar').hidden = false;
    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    const nav = $('pagination');
    const pages = new Set([1, totalPages, state.page - 1, state.page, state.page + 1]);
    const ordered = [...pages].filter(page => page >= 1 && page <= totalPages).sort((a, b) => a - b);
    const parts = [`<button type="button" data-page="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''}>上一页</button>`];
    let previous = 0;
    ordered.forEach(page => {
      if (page - previous > 1) parts.push('<span class="ellipsis" aria-hidden="true">…</span>');
      parts.push(`<button type="button" data-page="${page}" class="${page === state.page ? 'current' : ''}" aria-label="第 ${page} 页" ${page === state.page ? 'aria-current="page"' : ''}>${page}</button>`);
      previous = page;
    });
    parts.push(`<button type="button" data-page="${state.page + 1}" ${state.page === totalPages ? 'disabled' : ''}>下一页</button>`);
    nav.innerHTML = parts.join('');
  }

  async function start() {
    try {
      const response = await fetch('data/catalog.json', { cache:'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const catalog = await response.json();
      state.days = catalog.days || [];
      state.availableDates = new Set(state.days.map(day => day.date));
      state.papers = state.days.flatMap(day => (day.papers || []).map(paper => ({ ...paper, date: day.date })));
      const dates = [...state.availableDates].sort();
      state.calendarMonth = dates.length ? monthFromKey(dates[dates.length - 1].slice(0,6)) : new Date();
      renderCalendar();
      render();
    } catch (error) {
      $('status').textContent = '数据暂时无法读取，请稍后刷新页面。';
      $('papers').innerHTML = '<div class="empty">尚未生成公开数据目录。</div>';
    }
  }
  function resetAndRender() { state.page = 1; render(); }
  $('search').addEventListener('input', resetAndRender);
  $('previous-month').addEventListener('click', () => { state.calendarMonth.setMonth(state.calendarMonth.getMonth() - 1); renderCalendar(); });
  $('next-month').addEventListener('click', () => { state.calendarMonth.setMonth(state.calendarMonth.getMonth() + 1); renderCalendar(); });
  $('calendar-grid').addEventListener('click', (event) => {
    const button = event.target.closest('button[data-date]');
    if (!button) return;
    state.selectedDate = button.dataset.date;
    state.page = 1;
    state.calendarMonth = monthFromKey(button.dataset.date.slice(0,6));
    renderCalendar();
    render();
  });
  $('all-dates').addEventListener('click', () => { state.selectedDate = 'all'; state.page = 1; renderCalendar(); render(); });
  $('today-date').addEventListener('click', () => { state.selectedDate = dateKey(new Date()); state.calendarMonth = monthFromKey(state.selectedDate.slice(0,6)); state.page = 1; renderCalendar(); render(); });
  $('page-size').addEventListener('change', (event) => { state.pageSize = Number(event.target.value); state.page = 1; render(); });
  $('pagination').addEventListener('click', (event) => {
    const button = event.target.closest('button[data-page]');
    if (!button || button.disabled) return;
    state.page = Number(button.dataset.page);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  start();
</script>
</body>
</html>
