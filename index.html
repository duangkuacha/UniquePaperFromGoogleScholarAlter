<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Scholar 文献库</title>
  <style>
    :root { --ink:#172033; --muted:#697386; --line:#e7eaf0; --brand:#3b5bdb; --soft:#f6f8ff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#f4f6fa; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(1120px,calc(100% - 32px)); margin:32px auto 64px; }
    header { padding:28px; color:white; border-radius:20px; background:linear-gradient(135deg,#263b80,#4c6fff); box-shadow:0 12px 32px #263b8030; }
    h1 { margin:0 0 8px; font-size:clamp(26px,4vw,40px); }
    header p { margin:0; color:#e6ebff; }
    .controls { display:grid; grid-template-columns:1.5fr 1fr; gap:12px; margin:20px 0; }
    input,select { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:inherit; }
    .stats { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 18px; }
    .stat { padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:white; color:var(--muted); }
    .stat strong { color:var(--ink); }
    #status { color:var(--muted); margin:12px 0; }
    .paper { margin:12px 0; padding:20px; border:1px solid var(--line); border-radius:14px; background:#fff; box-shadow:0 4px 14px #1b2a4a0a; }
    .paper h2 { margin:0 0 8px; font-size:19px; line-height:1.4; }
    .paper h2 a { color:var(--brand); text-decoration:none; }
    .paper h2 a:hover { text-decoration:underline; }
    .authors { margin-bottom:10px; color:#19704a; font-size:14px; }
    .abstract { margin:0; color:#4f596d; line-height:1.65; }
    .empty { padding:44px 20px; text-align:center; border:1px dashed #cdd4e1; border-radius:14px; color:var(--muted); background:white; }
    .pagination-bar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:22px; padding:14px 0; }
    .page-size { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; }
    .page-size select { width:auto; min-width:82px; padding:8px 10px; }
    .pagination { display:flex; align-items:center; justify-content:flex-end; gap:5px; flex-wrap:wrap; }
    .pagination button { min-width:36px; height:36px; padding:0 9px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); cursor:pointer; font:inherit; }
    .pagination button:hover:not(:disabled), .pagination button.current { border-color:var(--brand); background:var(--brand); color:#fff; }
    .pagination button:disabled { cursor:default; opacity:.45; }
    .pagination .ellipsis { padding:0 3px; color:var(--muted); }
    footer { margin-top:28px; color:var(--muted); font-size:13px; }
    @media (max-width:680px) { main { width:min(100% - 20px,1120px); margin-top:10px; } header { padding:22px; } .controls { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Google Scholar 文献库</h1>
    <p>按日期浏览邮件中整理的去重论文，支持标题、作者和摘要搜索。</p>
  </header>
  <section class="controls" aria-label="筛选">
    <input id="search" type="search" placeholder="搜索标题、作者或摘要…" aria-label="搜索论文">
    <select id="date" aria-label="选择日期"><option value="all">全部日期</option></select>
  </section>
  <div id="stats" class="stats"></div>
  <div id="status">正在读取数据…</div>
  <section id="papers"></section>
  <div id="pagination-bar" class="pagination-bar" hidden>
    <label class="page-size" for="page-size">每页显示
      <select id="page-size" aria-label="每页显示条数">
        <option value="50" selected>50 条</option>
        <option value="100">100 条</option>
      </select>
    </label>
    <nav id="pagination" class="pagination" aria-label="论文分页"></nav>
  </div>
  <footer>数据由 GitHub Actions 定时从 Gmail Google Scholar Alert 邮件更新。页面只包含论文元数据，不保存 OAuth 凭据。</footer>
</main>
<script>
  const state = { days: [], papers: [], page: 1, pageSize: 50 };
  const $ = (id) => document.getElementById(id);
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatDate = (date) => date && date.length === 8 ? `${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6,8)}` : date;

  function render() {
    const query = $('search').value.trim().toLocaleLowerCase();
    const selected = $('date').value;
    const filtered = state.papers.filter(item => {
      const dateOk = selected === 'all' || item.date === selected;
      const haystack = `${item.title} ${item.authors} ${item.abstract}`.toLocaleLowerCase();
      return dateOk && (!query || haystack.includes(query));
    });
    const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    const start = filtered.length ? (state.page - 1) * state.pageSize : 0;
    const visible = filtered.slice(start, start + state.pageSize);
    const range = filtered.length ? `${start + 1}-${start + visible.length} / ${filtered.length}` : '0 / 0';
    $('stats').innerHTML = `<div class="stat">显示 <strong>${range}</strong> 篇论文</div><div class="stat">收录 <strong>${state.days.length}</strong> 个日期文件</div>`;
    $('status').textContent = filtered.length ? `最后筛选结果：${filtered.length} 篇` : '没有匹配的论文';
    if (!filtered.length) { $('papers').innerHTML = '<div class="empty">没有找到符合条件的论文。</div>'; $('pagination-bar').hidden = true; return; }
    $('papers').innerHTML = visible.map(item => {
      const title = escapeHtml(item.title);
      const titleHtml = item.url ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${title}</a>` : title;
      return `<article class="paper"><h2>${titleHtml}</h2><div class="authors">${escapeHtml(item.authors || '作者信息未提供')} · ${formatDate(item.date)}</div><p class="abstract">${escapeHtml(item.abstract || '没有摘要')}</p></article>`;
    }).join('');
    $('pagination-bar').hidden = false;
    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    const nav = $('pagination');
    const pages = new Set([1, totalPages, state.page - 1, state.page, state.page + 1]);
    const ordered = [...pages].filter(page => page >= 1 && page <= totalPages).sort((a, b) => a - b);
    const parts = [`<button type="button" data-page="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''}>上一页</button>`];
    let previous = 0;
    ordered.forEach(page => {
      if (page - previous > 1) parts.push('<span class="ellipsis" aria-hidden="true">…</span>');
      parts.push(`<button type="button" data-page="${page}" class="${page === state.page ? 'current' : ''}" aria-label="第 ${page} 页" ${page === state.page ? 'aria-current="page"' : ''}>${page}</button>`);
      previous = page;
    });
    parts.push(`<button type="button" data-page="${state.page + 1}" ${state.page === totalPages ? 'disabled' : ''}>下一页</button>`);
    nav.innerHTML = parts.join('');
  }

  async function start() {
    try {
      const response = await fetch('data/catalog.json', { cache:'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const catalog = await response.json();
      state.days = catalog.days || [];
      state.papers = state.days.flatMap(day => (day.papers || []).map(paper => ({ ...paper, date: day.date })));
      const dates = [...new Set(state.days.map(day => day.date))].sort().reverse();
      $('date').innerHTML += dates.map(date => `<option value="${date}">${formatDate(date)}</option>`).join('');
      render();
    } catch (error) {
      $('status').textContent = '数据暂时无法读取，请稍后刷新页面。';
      $('papers').innerHTML = '<div class="empty">尚未生成公开数据目录。</div>';
    }
  }
  function resetAndRender() { state.page = 1; render(); }
  $('search').addEventListener('input', resetAndRender);
  $('date').addEventListener('change', resetAndRender);
  $('page-size').addEventListener('change', (event) => { state.pageSize = Number(event.target.value); state.page = 1; render(); });
  $('pagination').addEventListener('click', (event) => {
    const button = event.target.closest('button[data-page]');
    if (!button || button.disabled) return;
    state.page = Number(button.dataset.page);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  start();
</script>
</body>
</html>
